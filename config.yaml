# ---------------------------------------------------------------------------
# odb_scanner configuration
# SAFETY: this system is READ-ONLY by design. The UDS layer physically blocks
# any write/security/routine service. See diagnostic/uds.py.
# ---------------------------------------------------------------------------

vehicle:
  # The car's own VIN goes in config.local.yaml (gitignored), not here: this
  # file is public. Tests use the synthetic WVWZZZE1ZMS000001.
  vin: ""
  make: "Volkswagen"
  model: "ID.3"
  variant: "58 kWh (Pro)"
  year: 2021
  # DID map to use: meb (ID.3/ID.4/Enyaq/Born, 108 cell slots, module
  # addressing) or eup (e-Up / OVMS-sourced, 102 slots). Only affects decoding
  # and which module a DID read is addressed to -- never read/write behaviour.
  did_profile: meb

adapter:
  # elm327_serial  -> USB ELM327 / OBDLink (pyserial)
  #                   also Bluetooth SPP: "Standard Serial over Bluetooth link"
  # elm327_tcp     -> simulator or TCP-serial bridge
  type: elm327_serial       # real car via Veepeak OBDCheck BLE+ (Bluetooth SPP)
  port: COM3                # outgoing "Serial over Bluetooth link" (COM4 is the
                            # incoming one); set "auto" to scan ports instead
  baudrate: 38400           # ignored over SPP; relevant for USB adapters
  timeout: 5.0
  tcp_host: "127.0.0.1"
  tcp_port: 35000
  # Optional discovery hints, used only when port is "auto". They PRIORITISE a
  # matching device during the scan; they never bypass the ATI probe, so a wrong
  # hint just changes the order ports are tried. Accepts an int or hex string.
  #
  # A hint is a chip/product identifier, NOT proof of OBD support. VID 0403 is
  # FTDI, a chip vendor shared by thousands of unrelated products (and by some
  # Ross-Tech HEX interfaces) -- it identifies the chip, never the protocol.
  # Run `python tools/discover_adapters.py` to see real VID/PID values first.
  # vid: 0x1A86             # e.g. a CH340-based USB adapter
  # pid: 0x7523

collector:
  poll_interval: 5.0        # fast poll (battery) seconds
  slow_poll_interval: 60.0  # slow poll (charging, SOH, counters) seconds
  read_cell_voltages: true  # per-cell DID sweep (slow, one DID per cell)
  # Oldest a cached measurement may be and still be used to fill a gap in the
  # current battery snapshot. Must exceed slow_poll_interval; beyond this a
  # missing value is recorded as unknown rather than carried forward.
  max_value_age_s: 900.0
  read_cell_temperatures: false
  # A DID that has never succeeded on this vehicle and returns NO DATA (not an
  # NRC) for this many consecutive reads is retired and not polled again. Raise
  # it if you collect while the car is asleep; a DID that has EVER answered is
  # never retired, because silence then means "car asleep", not "DID dead".
  silent_retire_threshold: 3
  # Parked car. Once the car stops answering, the collector sends it nothing:
  # every parked_probe_interval seconds it reads only the adapter's own voltage
  # (ATRV, measured at the OBD port -- no traffic on the car's bus) and resumes
  # when that reaches wake_voltage, which needs the DC-DC converter running
  # (car awake, driving or charging). A resting 12 V battery reads 12.4-13.2 V.
  parked_probe_interval: 600.0
  wake_voltage: 13.5
  # While parked, each of those readings is kept (key adapter_12v_voltage, so
  # the overnight trend shows in Explore) and an alert goes out, once per
  # parked spell, if one falls below this. A resting 12 V battery reads about
  # 12.6 V full and 12.0 V a quarter charged; the car tops it up itself.
  low_12v_voltage: 12.0
  # UDS DTC status mask for the single functional 0x19 0x02 read each cycle.
  # 0x8F asks for DTCs that are lighting the warning lamp (0x80), or that are
  # confirmed (0x08), pending (0x04), failed-this-cycle (0x02) or testFailed
  # (0x01). 0x08 is the old confirmed-only behaviour. This does NOT add a
  # request -- it widens one read -- and it is how a fault that lights the dash
  # before it is confirmed becomes visible at all.
  dtc_status_mask: "8F"
  # Extra ECUs to ask for DTCs *physically* (one request each per cycle).
  # The functional 0x19 0x02 read goes out on 29-bit 18DB33F1 and cannot reach
  # a module that only answers physical requests. eldrive is read physically
  # for its DIDs, so it is asked physically for DTCs too -- otherwise an
  # electric-drive fault can light the dash while this tool sees no code.
  dtc_ecu_keys: ["eldrive"]

database:
  # The car's own history, and nothing else's. The simulator writes to
  # simulation.db_path and `main.py seed` to seed.db_path; config.py refuses to
  # start if either is set to this same file.
  #
  # This file holds every real reading from the first adapter connection
  # (2026-10-05T18:03:02Z) onward. Two neighbours are NOT it: data/real_car.db
  # is an older, partial copy of the same history (Oct 5-15) kept as the
  # evidence artifact that docs/investigation/ and decoders/meb.py cite by name,
  # and data/odb_scanner_cdrive_20261015.db holds nothing but simulator output
  # from 2026-09-20 -- despite a name that reads like a car session.
  path: "data/odb_scanner.db"
  # Sub-folder (beside the database) that `main.py backup` writes timestamped
  # snapshots into. Point this at a different drive if this machine is not the
  # only place a copy of the car's history should live.
  backup_dir: "backups"
  # Newest snapshots `main.py backup` keeps in backup_dir and in the mirror;
  # null keeps every one. Only its own timestamped files are ever pruned.
  backup_keep: null
  # An existing folder, usually on an external drive, that each checked
  # snapshot is copied into. Skipped (never created) while it is missing, so a
  # drive that is not plugged in cannot turn into a folder on this disk.
  backup_mirror_dir: null

cloud:
  # Optional cloud logging. When enabled, decoded measurements are mirrored to
  # a shared MySQL/MariaDB database so the phone app and this collector write
  # into ONE schema. Local SQLite stays the source of truth and collection
  # NEVER blocks on the cloud: uploads are best-effort batches resumed from a
  # watermark, so an unreachable cloud costs nothing but a log line.
  #
  # Nothing here talks to the database directly. Both writers POST to the
  # cloud ingest API (see cloud/README.md), which owns the schema and the
  # database credentials -- so no DB password ever lives on the phone or in
  # this file.
  #
  # The target can also be overridden per run with the ODB_CLOUD_ENABLED,
  # ODB_CLOUD_API_URL and ODB_CLOUD_TOKEN environment variables, which is how
  # tools/cloud_local_check.py points at a throwaway local stack.
  enabled: false
  # Base URL of the ingest API, e.g. "https://odb-cloud.fly.dev".
  api_url: ""
  # This writer's stable identity in the cloud `sources` table. Leave empty to
  # derive "python:<hostname>".
  source_id: ""
  # Readings per upload request, and how often a running collector flushes.
  batch_size: 500
  sync_interval_s: 60.0
  timeout_s: 15.0
  # Set false only for a self-signed certificate on a LAN deployment.
  verify_tls: true
  # Bearer token for the ingest API. Set it in config.local.yaml (gitignored)
  # or export ODB_CLOUD_TOKEN; do not commit it here.
  # token: "..."

# `main.py ingest`: the same ingest API on this PC, archiving into SQLite, so
# the PC can be the archive without MySQL (odb-ingest.service runs it). Its
# token is cloud.token. Loopback by default: this PC's own collector uploads to
# it at cloud.api_url http://127.0.0.1:8080. For the phones, which only upload
# over HTTPS, put HTTPS in front of it (e.g. `tailscale serve`); a
# network-reachable host refuses a cloud.token shorter than 32 characters.
# `main.py backup` snapshots the archive alongside the car's database.
ingest:
  db_path: null            # e.g. ~/odb_data/archive.db -- never database.path
  host: "127.0.0.1"
  port: 8080

# Alerts: a new fault code, the 12 V battery low while parked, a backup that
# failed its integrity check, a filling disk, a finished charge. Always logged
# (WARNING, "ALERT ..."). ntfy_url also pushes them to the ntfy app (ntfy.sh or
# your own server) -- set it in config.local.yaml, because anyone who knows a
# topic can read it; use a long random topic name. desktop shows them with
# notify-send in a logged-in desktop session.
notify:
  ntfy_url: null          # e.g. https://ntfy.sh/<long random topic>
  ntfy_token: null        # only for an access-controlled topic
  desktop: false

# Home charging cost on the charging pages and in the "charging finished"
# alert. Applies to AC sessions only (public DC prices vary). The session
# energy is measured on the car's side; the meter sees more, so the cost
# divides by home_charging_efficiency. Leave the tariff null for no cost.
charging:
  home_tariff_per_kwh: null   # e.g. 0.245
  currency: "£"
  home_charging_efficiency: 0.9

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:7b"       # change freely: ollama pull <model>, set here
  temperature: 0.2
  timeout: 300
  # Context window and output cap sent with every request. Ollama's own
  # default context (2048-4096 tokens) is smaller than the evidence packet
  # and truncates it silently; the cap stops a runaway generation running
  # into the timeout and losing the whole report.
  num_ctx: 8192
  num_predict: 1024

ai:
  # Which AI writes the reports on the AI Analysis page (and `main.py report`).
  # ollama = the local model above: nothing leaves this machine. Any other
  # value sends your question and the evidence summary -- never the VIN -- to
  # that cloud service: anthropic (Claude), openai, gemini, mistral, groq,
  # openrouter, deepseek, xai, or custom (any OpenAI-compatible base_url).
  # Put the key in config.local.yaml (or ODB_AI_KEY), never here.
  provider: ollama
  # Blank: Claude uses claude-opus-5-5, gemini gemini-3.8-flash, groq
  # llama-3.3-70b-versatile, mistral mistral-small-latest -- those three have
  # free tiers. The others need one named (an unset model lists what the key
  # can use when you ask).
  model: ""
  api_key: ""
  base_url: ""          # provider custom only, e.g. https://example.com/v1
  effort: medium        # Claude only: low | medium | high | xhigh | max
  timeout: 300
  # Backups, tried in order when the service above fails (a free tier's rate
  # limit, an outage, a refused key, Ollama not running). Each is a provider
  # name, or a mapping with its own api_key (and optionally model, base_url,
  # effort) -- keys in config.local.yaml, like api_key. A report written by a
  # backup says so, and which service failed. If ANY of them is a cloud
  # service, the VIN is removed before asking, even when the first is Ollama.
  # e.g. fallbacks: [{provider: groq, api_key: "..."}, ollama]
  fallbacks: []

web:
  # 0.0.0.0 makes the dashboard reachable from the network so a tablet can
  # open it. That is only safe because such a bind REQUIRES an access token
  # (web/auth.py): the first run mints one, saves it to config.local.yaml --
  # gitignored -- and prints the URL to open. Requests without it get 401.
  # Set this to 127.0.0.1 to disable the token entirely and keep the dashboard
  # reachable only from this machine.
  host: "0.0.0.0"
  port: 8000                # the tablet: http://<PC-IP>:8000
  # auth_token: "..."       # normally not set here; see config.local.yaml
  # Car-position map on the overview. "osm" loads OpenStreetMap tiles, which
  # tells their servers roughly where the car is (the tiles around it); "off"
  # requests nothing from outside this machine and shows coordinates only.
  map_tiles: osm
  # Where the map opens until the first position is recorded: [lat, lon,
  # zoom]. Labelled on the card as a default view, never as the car's location.
  map_default_view: [50.0, 10.0, 5]

routing:
  # Route planner (dashboard Route page, phone app). Needs two free API keys:
  # OpenRouteService (roads, elevation, place search) and OpenChargeMap
  # (chargers). Put them in config.local.yaml, NOT here -- this file is shared.
  # Or set ODB_ORS_KEY / ODB_OCM_KEY. Planning sends the start, destination
  # and route to those two services; nothing else leaves the machine.
  ors_api_key: ""
  ocm_api_key: ""
  # Optional: a Mapbox access token (free account at mapbox.com; 100,000
  # route requests a month free) plans in today's traffic and offers up to
  # two other ways there. Put it in config.local.yaml, NOT here, or set
  # ODB_MAPBOX_TOKEN. The start and destination then go to Mapbox too.
  mapbox_token: ""
  # Roads to keep off unless the Route form says otherwise: any of
  # motorways, tolls, ferries.
  avoid: []
  reserve_pct: 10           # never plan to arrive below this
  charge_to_pct: 80         # never charge above this at a stop
  min_charger_kw: 50        # ignore slower chargers
  # How stops are chosen: fastest | balanced | cheapest (the Route form can
  # change it per trip). Balanced counts your time at time_value_per_hour.
  mode: balanced
  time_value_per_hour: 15
  # Price for chargers whose price is unknown, per kWh.
  default_price_per_kwh: 0.79
  # Your own price per network, which beats the price Open Charge Map lists
  # (matched against the charger's operator name). Put yours in
  # config.local.yaml, e.g.  prices: {Ionity: 0.39, Tesla: 0.55}
  prices: {}
  # Charging networks, matched against the charger's operator name by any part,
  # ignoring case ("ionity" matches "IONITY GmbH"). The Route form can change
  # them per trip. avoid_networks are never used. prefer_networks are favoured:
  # their energy counts prefer_discount (0.25 = 25 %) cheaper while stops are
  # chosen, so they win unless clearly worse; the costs shown stay real.
  avoid_networks: []        # e.g. [Shell Recharge, Pod Point]
  prefer_networks: []       # e.g. [Ionity, Gridserve]
  prefer_discount: 0.25
  # Private, restricted and staff/customer-only chargers are always left out.
  # true also leaves out "public, membership required" and "public, notice
  # required" ones.
  public_only: false
  # Countries place search is limited to, ISO codes: "GB" or "GB,FR". Blank
  # searches everywhere, and a town name may then resolve abroad ("Brighton"
  # comes back as Brighton, NY). Set it in config.local.yaml.
  countries: ""
  # Flat-road consumption, kWh/100 km. Empty: measured from this car's own
  # driving once 50 km is recorded, else 17 (ID.3, mixed driving, mild weather).
  consumption_kwh_per_100km:
  # The forecast along the route from Open-Meteo (free, no key): the wind is
  # counted, and the temperature through this car's own consumption model once
  # it has earned that. Sends points along the route rounded to 0.1° (~11 km).
  # false: no weather request; the plan assumes the car's usual conditions.
  weather: true

analysis:
  trend_window_days: 30     # battery trend + overview/chart window
  charging_window_days: 90  # charging sessions + DTC correlation window
  anomaly_zscore: 3.0

battery:
  # Nominal usable capacity of the pack in Ah. Used ONLY for the ESTIMATED
  # SOH percentage (CAC / nominal). Published spec, not a measurement.
  # Default comes from decoders/bms.py (NOMINAL_CAC_AH_58KWH).
  nominal_cac_ah: 164.0

simulation:
  host: "127.0.0.1"
  port: 35000
  # The VIN the simulator answers with -- deliberately NOT vehicle.vin. A
  # simulator that reports the car's own VIN is indistinguishable from the car
  # the moment its rows are written next to real ones: that is exactly how 265k
  # simulated readings and a month of seeded example history ended up inside
  # this vehicle's own record (see docs/DATA_CATALOGUE.md). Keeping the demo
  # identity separate means a stray simulator run lands on its own vehicle row
  # instead of merging into the car's.
  vin: "WVWZZZE1ZMS000001"
  # ...and it writes to its own database. `tools/start_scanner.py` points the
  # collector at this file whenever it starts the simulator, and config loading
  # refuses a configuration where the two are the same file.
  db_path: "data/simulator.db"

seed:
  # `main.py seed` writes a 31-day example dataset so the dashboard and the
  # analysis paths can be exercised without a car. It gets its own file for the
  # same reason the simulator does: example history must never share a file (or
  # a VIN) with measured history.
  db_path: "data/seed_demo.db"
  vin: "WVWZZZE1ZMS000001"
