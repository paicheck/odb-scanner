# Weekly update pull requests, one per ecosystem (grouped), never merged
# automatically: CI runs on each, and merging stays the owner's decision.
#
# github-actions keeps the commit-hash pins in .github/workflows/ci.yml
# current (the "# vX.Y.Z" comment is updated with the hash). pip watches
# requirements-lock.txt, the exact set CI and the PC install. gradle watches
# the Android build.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android:
        patterns: ["*"]
