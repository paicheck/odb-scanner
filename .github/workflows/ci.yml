name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The scanner itself is developed on Windows (Bluetooth SPP COM
        # ports), but the test suite is pure Python and must stay portable.
        # 3.11 is the oldest version GitHub still ships a runner image for;
        # the code itself needs nothing newer than 3.10.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install ruff pytest-randomly

      - name: Lint
        run: ruff check .

      # Known vulnerabilities in the locked dependencies. Once, not per
      # interpreter: every job installs the same requirements-lock.txt.
      - name: Dependency audit
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-lock.txt

      # The .bat shortcuts are the primary interface on Windows, where the
      # real user has no car and only a tablet. They cannot run here, but
      # their wiring can be checked: every command they call must exist.
      - name: Check the .bat shortcuts
        run: python tests/check_bat_wrappers.py

      - name: Unit tests (fast)
        run: python -m pytest -m "not slow"

      # pytest-randomly (installed above) shuffles test order on every run, so
      # a hidden order dependency -- one test relying on state another left
      # behind -- surfaces as a failure instead of a coincidence. The shared
      # experiment-matrix state (tools/experiment_record.ARMS) is restored
      # around every test in tests/conftest.py for exactly this reason.
      - name: Unit tests (full suite)
        run: python -m pytest

      # Proves the whole pipeline end to end -- simulator -> collector ->
      # SQLite -> analysis -> web -> read-only guard -- with no car and no
      # Ollama. This is the check that would catch a break in wiring that
      # unit tests mocking the transport would miss.
      - name: End-to-end smoke test
        run: python tools/smoke_test.py

      # The safety guarantee is structural: nothing that modifies the
      # vehicle may reach the wire. Assert it explicitly rather than trusting
      # the test suite to keep covering it.
      - name: Read-only guard
        run: python main.py guard-test

  windows:
    # The scanner actually runs on Windows (Bluetooth SPP COM ports, the .bat
    # launchers, a checkout under OneDrive), and the Linux matrix cannot see
    # path-separator, encoding or file-locking differences. One Python version
    # is enough: the job is here for the OS, not the interpreter.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Unit tests (fast)
        run: python -m pytest -m "not slow"

      - name: End-to-end smoke test
        run: python tools/smoke_test.py

      - name: Read-only guard
        run: python main.py guard-test

  android:
    # The phone speaks the same wire protocol as the Python transport and
    # carries the same generated spec, so it needs the same kind of gate. The
    # JVM tests are the transport/decoder/guard parity checks; the spec check
    # is what stops the bundled asset from silently drifting from the
    # registry (it did exactly that in October 2026).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python (spec drift check)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install pytest

      - name: Bundled spec matches the registry
        run: python -m pytest -q tests/test_spec_export_in_sync.py

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK, ANDROID_HOME set and its
      # licences accepted. android-actions/setup-android only re-ran
      # sdkmanager, which (cmdline-tools 16.0) stops on the SDK *preview*
      # licence and exits 1 -- the step that failed this job on every run.
      # Gradle installs any missing component itself.
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      # The phones get the release build (not debuggable). Building it here
      # also runs lintVitalRelease, which the debug build never does.
      - name: Release build
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
