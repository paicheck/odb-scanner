name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The scanner itself is developed on Windows (Bluetooth SPP COM
        # ports), but the test suite is pure Python and must stay portable.
        # 3.11 is the oldest version GitHub still ships a runner image for;
        # the code itself needs nothing newer than 3.10.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install ruff

      - name: Lint
        run: ruff check .

      # The .bat shortcuts are the primary interface on Windows, where the
      # real user has no car and only a tablet. They cannot run here, but
      # their wiring can be checked: every command they call must exist.
      - name: Check the .bat shortcuts
        run: python tests/check_bat_wrappers.py

      - name: Unit tests (fast)
        run: python -m pytest -m "not slow"

      - name: Unit tests (full suite)
        run: python -m pytest

      # Proves the whole pipeline end to end -- simulator -> collector ->
      # SQLite -> analysis -> web -> read-only guard -- with no car and no
      # Ollama. This is the check that would catch a break in wiring that
      # unit tests mocking the transport would miss.
      - name: End-to-end smoke test
        run: python tools/smoke_test.py

      # The safety guarantee is structural: nothing that modifies the
      # vehicle may reach the wire. Assert it explicitly rather than trusting
      # the test suite to keep covering it.
      - name: Read-only guard
        run: python main.py guard-test